<!doctype html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7fb;
      --surface: #ffffff;
      --surface-muted: #f8fafc;
      --line: #dde5ef;
      --line-strong: #9db7da;
      --text: #111827;
      --muted: #667085;
      --primary: #1d4ed8;
      --primary-soft: #eaf2ff;
      --success: #067647;
      --success-bg: #ecfdf3;
      --success-line: #abefc6;
      --danger: #b42318;
      --danger-bg: #fff4ed;
      --danger-line: #fdba8c;
      --warn: #92400e;
      --warn-bg: #fff7e6;
      --shadow: 0 10px 24px rgba(16, 24, 40, .08);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      min-height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, "Hiragino Sans", "Yu Gothic", sans-serif;
      letter-spacing: 0;
    }

    button,
    input {
      font: inherit;
    }

    button {
      min-height: 44px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:disabled {
      cursor: default;
      opacity: .58;
    }

    .app {
      width: min(100%, 760px);
      margin: 0 auto;
      padding: 18px 16px 28px;
    }

    .app-header {
      display: grid;
      gap: 8px;
      margin-bottom: 14px;
    }

    .app-title {
      margin: 0;
      font-size: 24px;
      line-height: 1.25;
      font-weight: 700;
    }

    .app-subtitle {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
      font-weight: 700;
    }

    .student-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .meta-chip {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 5px 9px;
      border-radius: 8px;
      background: var(--primary-soft);
      color: var(--primary);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .meta-chip.empty {
      background: #eef2f7;
      color: var(--muted);
    }

    .preview-banner {
      margin-bottom: 14px;
      padding: 10px 12px;
      border: 1px solid #f4c277;
      border-radius: 8px;
      background: #fffaf0;
      color: #92400e;
      font-size: 13px;
      line-height: 1.45;
      font-weight: 800;
    }

    .status-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 14px;
    }

    .status-card,
    .card {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
    }

    .status-card {
      min-width: 0;
      padding: 10px;
    }

    .status-label,
    .section-label,
    .helper {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .given-values {
      display: grid;
      gap: 6px;
      padding: 10px 11px;
      border: 1px solid #dbe7f5;
      border-radius: 8px;
      background: #f7fbff;
    }

    .given-values-title {
      color: #344054;
      font-size: 12px;
      font-weight: 800;
      line-height: 1.35;
    }

    .given-values-list {
      display: grid;
      gap: 4px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .given-values-list li {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: baseline;
      color: #344054;
      font-size: 12px;
      line-height: 1.4;
    }

    .given-values-list span {
      overflow-wrap: anywhere;
    }

    .given-values-list strong {
      color: var(--text);
      font-weight: 800;
      white-space: nowrap;
    }

    .status-value {
      display: block;
      margin-top: 2px;
      font-size: clamp(18px, 6vw, 24px);
      line-height: 1.2;
      font-weight: 800;
      word-break: keep-all;
    }

    .card {
      display: grid;
      gap: 12px;
      margin-bottom: 14px;
      padding: 14px;
      box-shadow: 0 1px 0 rgba(16, 24, 40, .03);
    }

    .level-buttons {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 3px;
      min-height: 44px;
      padding: 3px;
      border-radius: 8px;
      background: #eff4fa;
    }

    .level-button {
      display: grid;
      place-items: center;
      gap: 2px;
      min-width: 0;
      padding: 6px 4px;
      background: transparent;
      color: #344054;
      font-weight: 800;
    }

    .level-name {
      font-size: 14px;
      line-height: 1.15;
    }

    .level-copy {
      font-size: 10px;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }

    .level-button.active {
      background: var(--primary);
      color: #fff;
      box-shadow: var(--shadow);
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .unit-pill {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 4px 8px;
      border-radius: 8px;
      background: var(--warn-bg);
      color: var(--warn);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .question-text {
      min-height: 92px;
      margin: 0;
      font-size: clamp(20px, 5.4vw, 26px);
      line-height: 1.45;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .answer-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: stretch;
    }

    .answer-input {
      width: 100%;
      min-height: 56px;
      padding: 10px 12px;
      border: 2px solid var(--line-strong);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      font-size: 22px;
      font-weight: 800;
      outline: none;
    }

    .answer-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(29, 78, 216, .12);
    }

    .unit-box {
      display: inline-grid;
      place-items: center;
      min-width: 52px;
      min-height: 56px;
      padding: 0 10px;
      border-radius: 8px;
      background: #f2f4f7;
      color: #344054;
      font-size: 15px;
      font-weight: 800;
    }

    .primary-button,
    .secondary-button,
    .danger-button {
      width: 100%;
      font-weight: 800;
    }

    .primary-button {
      min-height: 52px;
      background: var(--primary);
      color: #fff;
      font-size: 16px;
    }

    .secondary-button {
      border: 1px solid var(--primary);
      background: #fff;
      color: var(--primary);
      font-size: 15px;
    }

    .danger-button {
      border: 1px solid #d92d20;
      background: #fff;
      color: var(--danger);
      font-size: 14px;
    }

    .result-panel {
      border-color: var(--success-line);
      background: var(--success-bg);
    }

    .result-panel.incorrect {
      border-color: #fecdca;
      background: #fff7f7;
    }

    .result-heading {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .result-mark {
      display: inline-grid;
      place-items: center;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #12b76a;
      color: #fff;
      font-weight: 800;
      line-height: 1;
    }

    .incorrect .result-mark {
      background: #f04438;
    }

    .result-title {
      margin: 0;
      color: var(--success);
      font-size: 20px;
      line-height: 1.3;
      font-weight: 800;
    }

    .incorrect .result-title {
      color: var(--danger);
    }

    .answer-summary {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .answer-summary-item {
      min-width: 0;
      padding: 9px;
      border-radius: 8px;
      background: rgba(255, 255, 255, .72);
    }

    .answer-summary-item strong {
      display: block;
      margin-top: 2px;
      font-size: 15px;
      overflow-wrap: anywhere;
    }

    .explanation {
      margin: 0;
      font-size: 14px;
      line-height: 1.55;
      overflow-wrap: anywhere;
    }

    .rounding-note {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .error-panel {
      border-color: var(--danger-line);
      background: var(--danger-bg);
    }

    .error-title {
      margin: 0;
      color: var(--danger);
      font-size: 15px;
      line-height: 1.4;
      font-weight: 800;
    }

    .error-message {
      margin: 0;
      color: #7a271a;
      font-size: 13px;
      line-height: 1.45;
    }

    .loading-bar {
      position: sticky;
      top: 0;
      z-index: 2;
      display: none;
      align-items: center;
      gap: 8px;
      min-height: 38px;
      margin: -18px -16px 14px;
      padding: 8px 16px;
      background: #eef4ff;
      color: #1d4ed8;
      font-size: 13px;
      font-weight: 800;
      border-bottom: 1px solid #c7d7fe;
    }

    .loading .loading-bar {
      display: flex;
    }

    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(29, 78, 216, .24);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    .hidden {
      display: none !important;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (min-width: 680px) {
      .app {
        padding-top: 28px;
      }

      .app-header {
        grid-template-columns: 1fr auto;
        align-items: end;
      }

      .student-meta {
        justify-content: flex-end;
      }

      .card {
        padding: 18px;
      }

      .question-text {
        min-height: 76px;
      }
    }

    @media (max-width: 360px) {
      .app {
        padding-right: 12px;
        padding-left: 12px;
      }

      .status-card {
        padding: 8px;
      }

      .status-label {
        font-size: 11px;
      }

      .answer-summary {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="app" id="appRoot">
    <div class="loading-bar" id="loadingBar" aria-live="polite">
      <span class="spinner" aria-hidden="true"></span>
      <span id="loadingText">通信中...</span>
    </div>

    <header class="app-header">
      <div>
        <h1 class="app-title">もるくえ！</h1>
        <p class="app-subtitle">Classroom連携型モル計算練習アプリ</p>
      </div>
      <div class="student-meta" aria-label="生徒情報">
        <span class="meta-chip empty" id="className">クラス確認中</span>
        <span class="meta-chip empty" id="studentNumber">番号確認中</span>
        <span class="meta-chip empty" id="studentName">名前確認中</span>
      </div>
    </header>

    <section class="preview-banner hidden" id="teacherPreviewBanner" aria-live="polite">
      教師プレビュー中：この操作は解答ログに保存されません
    </section>

    <section class="status-grid" aria-label="学習状況">
      <div class="status-card">
        <span class="status-label">総解答数</span>
        <strong class="status-value" id="totalAttempts">0</strong>
      </div>
      <div class="status-card">
        <span class="status-label">直近10問</span>
        <strong class="status-value" id="recentAccuracy">0%</strong>
      </div>
      <div class="status-card">
        <span class="status-label">現在</span>
        <strong class="status-value" id="currentLevelLabel">初級</strong>
      </div>
    </section>

    <section class="card" aria-label="レベル選択">
      <span class="section-label">レベル選択</span>
      <div class="level-buttons" id="levelButtons" role="group" aria-label="問題レベル">
        <button class="level-button active" type="button" data-level="beginner" aria-pressed="true"><span class="level-name">初級</span><span class="level-copy">まずは変換に慣れよう</span></button>
        <button class="level-button" type="button" data-level="intermediate" aria-pressed="false"><span class="level-name">中級</span><span class="level-copy">少し手順が増える問題に挑戦</span></button>
        <button class="level-button" type="button" data-level="advanced" aria-pressed="false"><span class="level-name">上級</span><span class="level-copy">有効数字3桁で仕上げよう</span></button>
      </div>
    </section>

    <section class="card" aria-label="問題">
      <div class="card-head">
        <span class="section-label">問題</span>
        <span class="unit-pill">単位: <span id="unitLabel">-</span></span>
      </div>
      <p class="question-text" id="questionText">問題を読み込んでいます。</p>
      <p class="helper" id="inputHintText">数値のみを入力してください。</p>
      <div class="given-values hidden" id="givenValuesPanel" aria-label="この問題で使う値">
        <div class="given-values-title" id="givenValuesTitle">この問題で使う値</div>
        <ul class="given-values-list" id="givenValuesList"></ul>
      </div>
      <div class="answer-row">
        <input
          class="answer-input"
          id="answerInput"
          type="text"
          inputmode="decimal"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          placeholder="例: 2.00"
          aria-label="解答入力"
        >
        <span class="unit-box" id="unitBox">-</span>
      </div>
      <button class="primary-button" id="submitButton" type="button" disabled>解答する</button>
      <button class="secondary-button" id="nextProblemButton" type="button" disabled>次の問題</button>
    </section>

    <section class="card result-panel hidden" id="resultPanel" aria-live="polite" aria-label="結果表示">
      <div class="result-heading">
        <span class="result-mark" id="resultMark">○</span>
        <h2 class="result-title" id="resultTitle">正解: できた！</h2>
      </div>
      <div class="answer-summary">
        <div class="answer-summary-item">
          <span class="status-label">正答</span>
          <strong id="expectedAnswerText">-</strong>
        </div>
        <div class="answer-summary-item">
          <span class="status-label">自分の解答</span>
          <strong id="submittedAnswerText">-</strong>
        </div>
      </div>
      <p class="explanation" id="explanationText">解説を表示します。</p>
      <p class="rounding-note" id="roundingNoteText">正答と解説を見て確認しましょう。</p>
    </section>

    <section class="card error-panel hidden" id="errorPanel" aria-live="assertive" data-error-types="token不正 通信失敗 入力不正">
      <p class="error-title" id="errorTitle">通信失敗</p>
      <p class="error-message" id="errorMessage">再試行できます。</p>
      <button class="danger-button" id="retryButton" type="button" data-retry-action="">再試行</button>
      <span class="sr-only">token不正 通信失敗 入力不正</span>
    </section>
  </main>

  <script>
    const initialToken = <?!= JSON.stringify(typeof initialToken === 'undefined' ? '' : initialToken) ?>;
    const initialAdminToken = <?!= JSON.stringify(typeof initialAdminToken === 'undefined' ? '' : initialAdminToken) ?>;
    const initialTeacherPreview = <?!= JSON.stringify(typeof initialTeacherPreview === 'undefined' ? false : initialTeacherPreview) ?>;
    const LEVEL_LABELS = {
      beginner: '初級',
      intermediate: '中級',
      advanced: '上級'
    };
    const DEFAULT_ROUNDING_NOTE = '単位は入力せず、数値だけ入力してください。';
    const RESULT_COPY = {
      correct: [
        'できた！',
        'ばっちり合っています！',
        'いい感じ！',
        'その調子！',
        'いいですね！式の立て方も合っています！',
        'いい感じです！単位までよく見られています！'
      ],
      incorrect: [
        'もう一歩！',
        '惜しい！',
        '惜しい！単位を確認してみよう！',
        'ここで整理しておこう！次はきっと近づく！'
      ]
    };

    const params = new URLSearchParams(window.location.search);
    const state = {
      token: (params.get('t') || params.get('token') || initialToken || '').trim(),
      adminToken: (initialAdminToken || '').trim(),
      teacherPreview: initialTeacherPreview === true || params.get('preview') === 'teacher' || params.get('teacherPreview') === '1',
      selectedLevel: 'beginner',
      problem: null,
      pendingProblem: null,
      prefetchedProblem: null,
      prefetchedLevel: '',
      prefetchLevel: '',
      prefetchPromise: null,
      prefetchRequestId: 0,
      isPrefetching: false,
      startedAt: 0,
      answerLocked: false,
      isInitializing: false,
      isSubmitting: false,
      lastAction: null
    };

    const elements = {
      appRoot: document.getElementById('appRoot'),
      loadingText: document.getElementById('loadingText'),
      teacherPreviewBanner: document.getElementById('teacherPreviewBanner'),
      className: document.getElementById('className'),
      studentNumber: document.getElementById('studentNumber'),
      studentName: document.getElementById('studentName'),
      totalAttempts: document.getElementById('totalAttempts'),
      recentAccuracy: document.getElementById('recentAccuracy'),
      currentLevelLabel: document.getElementById('currentLevelLabel'),
      levelButtons: Array.prototype.slice.call(document.querySelectorAll('[data-level]')),
      questionText: document.getElementById('questionText'),
      inputHintText: document.getElementById('inputHintText'),
      givenValuesPanel: document.getElementById('givenValuesPanel'),
      givenValuesTitle: document.getElementById('givenValuesTitle'),
      givenValuesList: document.getElementById('givenValuesList'),
      answerInput: document.getElementById('answerInput'),
      unitLabel: document.getElementById('unitLabel'),
      unitBox: document.getElementById('unitBox'),
      submitButton: document.getElementById('submitButton'),
      nextProblemButton: document.getElementById('nextProblemButton'),
      resultPanel: document.getElementById('resultPanel'),
      resultMark: document.getElementById('resultMark'),
      resultTitle: document.getElementById('resultTitle'),
      expectedAnswerText: document.getElementById('expectedAnswerText'),
      submittedAnswerText: document.getElementById('submittedAnswerText'),
      explanationText: document.getElementById('explanationText'),
      roundingNoteText: document.getElementById('roundingNoteText'),
      errorPanel: document.getElementById('errorPanel'),
      errorTitle: document.getElementById('errorTitle'),
      errorMessage: document.getElementById('errorMessage'),
      retryButton: document.getElementById('retryButton')
    };

    function runServer(method, args) {
      return new Promise(function (resolve, reject) {
        const runner = google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(reject);
        runner[method].apply(runner, args || []);
      });
    }

    function formatRate(value) {
      return Math.round(Number(value || 0) * 1000) / 10 + '%';
    }

    function pickCopy(candidates) {
      const list = Array.isArray(candidates) && candidates.length > 0 ? candidates : ['確認してみよう'];
      return list[Math.floor(Math.random() * list.length)];
    }

    function isSafeServerHtml(html) {
      const source = String(html == null ? '' : html);
      if (source === '') {
        return false;
      }
      const template = document.createElement('template');
      template.innerHTML = source;
      const nodes = template.content.querySelectorAll('*');
      for (const node of nodes) {
        if (node.tagName !== 'SUB' || node.attributes.length > 0 || !/^\d+$/.test(node.textContent || '')) {
          return false;
        }
      }
      return true;
    }

    function renderServerHtmlOrText(element, html, text, fallback) {
      const source = String(html == null ? '' : html);
      if (isSafeServerHtml(source)) {
        element.innerHTML = source;
        return;
      }
      element.textContent = String(text || fallback || '');
    }

    function hasSignificantDigitContext(data) {
      return data.level === 'advanced' && (data.requiresRounding === true || Number(data.significantDigits || 0) >= 3);
    }

    function buildResultTitle(data, correct) {
      if (correct) {
        const streak = Number(data.currentCorrectStreak || 0);
        if (streak >= 5) {
          return '正解: 5問連続、いい感じ！';
        }
        if (streak >= 3) {
          return '正解: 3問連続、その調子！';
        }
        if (hasSignificantDigitContext(data)) {
          return '正解: 有効数字までOK！ここは大事！';
        }
        return '正解: ' + pickCopy(RESULT_COPY.correct);
      }
      if (hasSignificantDigitContext(data)) {
        return '不正解: 惜しい！有効数字を確認してみよう！';
      }
      return '不正解: ' + pickCopy(RESULT_COPY.incorrect);
    }

    function buildRoundingNote(data, correct) {
      if (correct && data.acceptedAnswerType === 'rounded' && data.exactAnswerText) {
        return '正解。ただし正確な値は ' + data.exactAnswerText + ' です。';
      }
      if (correct && hasSignificantDigitContext(data)) {
        return '有効数字3桁まで確認できています。この調子で次へ進みましょう。';
      }
      if (!correct) {
        return 'ここで整理しておこう！解説を見て、次の1問で確認しよう。';
      }
      return DEFAULT_ROUNDING_NOTE;
    }

    function setLoading(isLoading, message) {
      elements.appRoot.classList.toggle('loading', isLoading);
      elements.loadingText.textContent = message || '通信中...';
      updateButtonStates();
    }

    function renderTeacherPreviewMode() {
      elements.teacherPreviewBanner.classList.toggle('hidden', !state.teacherPreview);
    }

    function updateButtonStates() {
      const busy = state.isInitializing || state.isSubmitting;
      elements.submitButton.disabled = busy || !state.problem || state.answerLocked;
      elements.nextProblemButton.disabled = busy || !state.answerLocked;
      elements.answerInput.disabled = busy || !state.problem;
      elements.answerInput.readOnly = state.answerLocked;
      elements.levelButtons.forEach(function (button) {
        button.disabled = busy;
      });
    }

    function setMetaElement(element, text, fallback) {
      const value = String(text || '').trim();
      element.textContent = value || fallback;
      element.classList.toggle('empty', value === '');
    }

    function renderStudent(student) {
      const data = student || {};
      setMetaElement(elements.className, data.courseName, 'クラス未確認');
      setMetaElement(elements.studentNumber, data.number ? data.number + '番' : '', '番号未確認');
      setMetaElement(elements.studentName, data.name, '名前未確認');
    }

    function renderSummary(summary) {
      const data = summary || {};
      elements.totalAttempts.textContent = String(Number(data.totalAttempts || 0));
      elements.recentAccuracy.textContent = formatRate(data.recent10Accuracy || 0);
    }

    function selectLevel(level) {
      state.selectedLevel = LEVEL_LABELS[level] ? level : 'beginner';
      elements.currentLevelLabel.textContent = LEVEL_LABELS[state.selectedLevel];
      elements.levelButtons.forEach(function (button) {
        const selected = button.dataset.level === state.selectedLevel;
        button.classList.toggle('active', selected);
        button.setAttribute('aria-pressed', selected ? 'true' : 'false');
      });
    }

    function getProblemAttemptId(problem) {
      return String(problem && problem.attemptId || '').trim();
    }

    function getProblemLevel(problem) {
      return String(problem && problem.level || '').trim();
    }

    function getProblemRequest(level) {
      const nextLevel = LEVEL_LABELS[level] ? level : state.selectedLevel;
      const method = state.teacherPreview ? 'getTeacherPreviewProblem' : 'getPracticeProblem';
      const args = state.teacherPreview
        ? [state.adminToken, { level: nextLevel }]
        : [state.token, { level: nextLevel }];
      return { method: method, args: args, level: nextLevel };
    }

    function isUsablePrefetchedProblem(problem, level) {
      const nextLevel = LEVEL_LABELS[level] ? level : state.selectedLevel;
      const attemptId = getProblemAttemptId(problem);
      if (!problem || !attemptId || getProblemLevel(problem) !== nextLevel) {
        return false;
      }
      return attemptId !== getProblemAttemptId(state.problem);
    }

    function hasUsablePrefetchedProblem(level) {
      return state.prefetchedLevel === (LEVEL_LABELS[level] ? level : state.selectedLevel)
        && isUsablePrefetchedProblem(state.prefetchedProblem, level);
    }

    function clearPrefetchedProblem() {
      state.prefetchedProblem = null;
      state.prefetchedLevel = '';
      state.prefetchLevel = '';
      state.prefetchPromise = null;
      state.prefetchRequestId += 1;
      state.isPrefetching = false;
    }

    function takePrefetchedProblem(level) {
      if (!hasUsablePrefetchedProblem(level)) {
        return null;
      }
      const problem = state.prefetchedProblem;
      clearPrefetchedProblem();
      return problem;
    }

    function startPrefetchForCurrentLevel() {
      if (!state.problem || state.answerLocked || state.pendingProblem || state.isPrefetching || hasUsablePrefetchedProblem(state.selectedLevel)) {
        return null;
      }
      const request = getProblemRequest(state.selectedLevel);
      const method = request.method;
      const args = request.args;
      const requestId = state.prefetchRequestId + 1;
      state.prefetchRequestId = requestId;
      state.prefetchedProblem = null;
      state.prefetchedLevel = '';
      state.isPrefetching = true;
      state.prefetchLevel = request.level;
      state.prefetchPromise = runServer(method, args)
        .then(function (problem) {
          if (state.prefetchRequestId !== requestId || state.prefetchLevel !== state.selectedLevel || state.answerLocked) {
            return null;
          }
          if (!isUsablePrefetchedProblem(problem, request.level)) {
            return null;
          }
          state.prefetchedProblem = problem;
          state.prefetchedLevel = request.level;
          if (window.console && console.info) {
            console.info('prefetchProblem ready', { level: request.level, attemptId: getProblemAttemptId(problem) });
          }
          updateButtonStates();
          return problem;
        })
        .catch(function (error) {
          if (state.prefetchRequestId === requestId && window.console && console.warn) {
            console.warn('prefetchProblem failed', error);
          }
          return null;
        })
        .finally(function () {
          if (state.prefetchRequestId === requestId) {
            state.isPrefetching = false;
            state.prefetchPromise = null;
            updateButtonStates();
          }
        });
      return state.prefetchPromise;
    }

    function hideError() {
      elements.errorPanel.classList.add('hidden');
      elements.retryButton.dataset.retryAction = '';
    }

    function hideResult() {
      elements.resultPanel.classList.add('hidden');
      elements.resultPanel.classList.remove('incorrect');
    }

    function renderGivenValues(problem) {
      const values = Array.isArray(problem && problem.givenValues) ? problem.givenValues : [];
      const title = String(problem && problem.givenValuesTitle || 'この問題で使う値');
      elements.givenValuesTitle.textContent = title === '与えられた値' ? '与えられた値' : 'この問題で使う値';
      elements.givenValuesPanel.setAttribute('aria-label', elements.givenValuesTitle.textContent);
      elements.givenValuesList.innerHTML = '';

      if (values.length === 0) {
        elements.givenValuesPanel.classList.add('hidden');
        return;
      }

      values.forEach(function (item) {
        const row = document.createElement('li');
        const label = document.createElement('span');
        const value = document.createElement('strong');
        renderServerHtmlOrText(label, item.labelHtml, item.label, '');
        label.insertBefore(document.createTextNode('・'), label.firstChild);
        renderServerHtmlOrText(value, item.valueHtml, item.value, '');
        row.appendChild(label);
        row.appendChild(value);
        elements.givenValuesList.appendChild(row);
      });
      elements.givenValuesPanel.classList.remove('hidden');
    }

    function normalizeClientNumber(input) {
      let text = String(input == null ? '' : input).trim();
      text = text.replace(/[０-９]/g, function (char) {
        return String.fromCharCode(char.charCodeAt(0) - 0xFEE0);
      });
      text = text
        .replace(/．/g, '.')
        .replace(/－/g, '-')
        .replace(/＋/g, '+')
        .replace(/，/g, ',')
        .replace(/×/g, 'x')
        .replace(/＾/g, '^')
        .replace(/\s+/g, '')
        .replace(/,/g, '');
      text = text.replace(/([+-]?(?:\d+(?:\.\d*)?|\.\d+))x10\^([+-]?\d+)/i, '$1e$2');
      text = text.replace(/([+-]?(?:\d+(?:\.\d*)?|\.\d+))\*10\^([+-]?\d+)/i, '$1e$2');
      return Number(text);
    }

    function validateAnswerInput() {
      const raw = elements.answerInput.value.trim();
      if (raw === '') {
        return '解答を入力してください。';
      }
      if (!Number.isFinite(normalizeClientNumber(raw))) {
        return '数値のみで入力してください。例: 2.00、6.0×10^23、6.0x10^23';
      }
      return '';
    }

    function showError(kind, error, retryAction) {
      const message = error && error.message ? error.message : String(error || '');
      const isTokenError = kind === 'token' || /token|無効なURL|URLを確認|見つかりません/i.test(message);
      const title = isTokenError ? 'token不正' : kind === 'input' ? '入力不正' : '通信失敗';
      const detail = isTokenError
        ? 'URLを確認できませんでした。先生から配付された本人用URLを開き直してください。'
        : kind === 'input'
          ? message
          : (message || '通信に失敗しました。接続を確認して、再試行してください。');

      elements.errorTitle.textContent = title;
      elements.errorMessage.textContent = detail;
      elements.retryButton.textContent = kind === 'input' ? '入力へ戻る' : '再試行';
      elements.retryButton.dataset.retryAction = retryAction || (kind === 'input' ? 'focusInput' : state.lastAction || 'initialize');
      elements.errorPanel.classList.remove('hidden');
    }

    function applyProblem(problem, shouldClearAnswer) {
      clearPrefetchedProblem();
      state.problem = problem || null;
      state.pendingProblem = null;
      state.answerLocked = false;
      state.startedAt = Date.now();
      hideError();
      hideResult();

      if (!state.problem) {
        elements.questionText.textContent = '問題を取得できませんでした。';
        elements.inputHintText.textContent = '再試行してください。';
        renderGivenValues(null);
        elements.unitLabel.textContent = '-';
        elements.unitBox.textContent = '-';
        updateButtonStates();
        return;
      }

      selectLevel(state.problem.level || state.selectedLevel);
      renderServerHtmlOrText(elements.questionText, state.problem.questionHtml, state.problem.questionText, '問題文を取得できませんでした。');
      elements.inputHintText.textContent = state.problem.inputHint || '数値のみを入力してください。';
      renderGivenValues(state.problem);
      elements.unitLabel.textContent = state.problem.unit || '-';
      elements.unitBox.textContent = state.problem.unit || '-';
      if (shouldClearAnswer !== false) {
        elements.answerInput.value = '';
      }
      updateButtonStates();
      setTimeout(function () {
        elements.answerInput.focus();
      }, 0);
      startPrefetchForCurrentLevel();
    }

    async function initialize() {
      state.lastAction = 'initialize';
      renderTeacherPreviewMode();
      if (!state.teacherPreview && !state.token) {
        showError('token', 'URLに token がありません。先生から配付されたURLで開いてください。', 'initialize');
        updateButtonStates();
        return;
      }
      if (state.teacherPreview && !state.adminToken) {
        showError('token', '教師プレビュー用の管理者tokenがありません。管理画面から開き直してください。', 'initialize');
        updateButtonStates();
        return;
      }
      state.isInitializing = true;
      setLoading(true, '読み込み中...');
      try {
        hideError();
        const method = state.teacherPreview ? 'initializeTeacherPreviewSession' : 'initializeStudentSession';
        const args = state.teacherPreview
          ? [state.adminToken, { level: state.selectedLevel, studentToken: state.token }]
          : [state.token, { level: state.selectedLevel }];
        const result = await runServer(method, args);
        renderStudent(result.student);
        renderSummary(result.summary);
        applyProblem(result.problem, true);
      } catch (error) {
        showError('token', error, 'initialize');
      } finally {
        state.isInitializing = false;
        setLoading(false, '');
      }
    }

    async function fetchProblem() {
      state.lastAction = 'fetchProblem';
      state.isInitializing = true;
      setLoading(true, '作成中...');
      try {
        hideError();
        clearPrefetchedProblem();
        const request = getProblemRequest(state.selectedLevel);
        const method = request.method;
        const args = request.args;
        const problem = await runServer(method, args);
        applyProblem(problem, true);
      } catch (error) {
        showError('network', error, 'fetchProblem');
      } finally {
        state.isInitializing = false;
        setLoading(false, '');
      }
    }

    function renderResult(result) {
      const data = result || {};
      const correct = data.isCorrect === true;
      elements.resultPanel.classList.toggle('incorrect', !correct);
      elements.resultMark.textContent = correct ? '○' : '×';
      elements.resultTitle.textContent = buildResultTitle(data, correct);
      elements.expectedAnswerText.textContent = data.expectedAnswerText || '-';
      elements.submittedAnswerText.textContent = data.submittedAnswerText || elements.answerInput.value || '-';
      renderServerHtmlOrText(elements.explanationText, data.explanationHtml, data.explanation, '解説はありません。');
      elements.roundingNoteText.textContent = buildRoundingNote(data, correct);
      elements.resultPanel.classList.remove('hidden');
    }

    async function submitAnswer() {
      if (!state.problem || state.isSubmitting) {
        return;
      }

      const inputError = validateAnswerInput();
      if (inputError) {
        showError('input', inputError, 'focusInput');
        return;
      }

      state.lastAction = 'submitAnswer';
      state.isSubmitting = true;
      elements.submitButton.disabled = true;
      setLoading(true, '採点中...');
      try {
        hideError();
        const submittedProblem = state.problem;
        const submittedAttemptId = getProblemAttemptId(submittedProblem);
        const request = {
          token: state.token,
          problem: submittedProblem,
          submittedAnswer: elements.answerInput.value,
          elapsedMs: Date.now() - state.startedAt,
          nextLevel: state.selectedLevel,
          skipNextProblem: hasUsablePrefetchedProblem(state.selectedLevel),
          clientInfo: { userAgent: navigator.userAgent }
        };
        const method = state.teacherPreview ? 'submitTeacherPreviewAnswer' : 'submitAnswer';
        const args = state.teacherPreview ? [state.adminToken, request] : [request];
        const response = await runServer(method, args);
        if (submittedAttemptId !== getProblemAttemptId(state.problem)) {
          throw new Error('表示中の問題が更新されました。もう一度送信してください。');
        }
        const result = response.result || {};
        renderResult(result);
        renderSummary(result);
        state.answerLocked = true;
        state.pendingProblem = takePrefetchedProblem(state.selectedLevel) || response.nextProblem || null;
        setTimeout(function () {
          elements.answerInput.focus();
        }, 0);
      } catch (error) {
        showError('network', error, 'submitAnswer');
      } finally {
        state.isSubmitting = false;
        setLoading(false, '');
      }
    }

    function canShowPrefetchedProblem() {
      return state.answerLocked && !state.isSubmitting && !state.isInitializing;
    }

    async function showNextProblem() {
      if (!state.answerLocked) {
        return;
      }
      if (state.isSubmitting || state.isInitializing) {
        return;
      }
      if (state.pendingProblem) {
        applyProblem(state.pendingProblem, true);
        return;
      }
      const prefetchedProblem = takePrefetchedProblem(state.selectedLevel);
      if (prefetchedProblem) {
        applyProblem(prefetchedProblem, true);
        return;
      }
      if (state.isPrefetching && state.prefetchLevel === state.selectedLevel && state.prefetchPromise) {
        state.lastAction = 'fetchProblem';
        state.isInitializing = true;
        setLoading(true, '作成中...');
        try {
          await state.prefetchPromise;
          const completedPrefetch = takePrefetchedProblem(state.selectedLevel);
          if (completedPrefetch) {
            applyProblem(completedPrefetch, true);
            return;
          }
        } finally {
          state.isInitializing = false;
          setLoading(false, '');
        }
      }
      fetchProblem();
    }

    function retryLastAction() {
      const action = elements.retryButton.dataset.retryAction;
      if (action === 'focusInput') {
        hideError();
        elements.answerInput.focus();
        return;
      }
      if (action === 'submitAnswer') {
        submitAnswer();
        return;
      }
      if (action === 'fetchProblem') {
        fetchProblem();
        return;
      }
      initialize();
    }

    elements.levelButtons.forEach(function (button) {
      button.addEventListener('click', function () {
        const nextLevel = button.dataset.level;
        if (nextLevel === state.selectedLevel) {
          return;
        }
        clearPrefetchedProblem();
        selectLevel(nextLevel);
        fetchProblem();
      });
    });
    elements.submitButton.addEventListener('click', submitAnswer);
    elements.nextProblemButton.addEventListener('click', showNextProblem);
    elements.retryButton.addEventListener('click', retryLastAction);
    elements.answerInput.addEventListener('keydown', function (event) {
      if (event.key === 'Enter') {
        event.preventDefault();
        if (canShowPrefetchedProblem()) {
          showNextProblem();
          return;
        }
        submitAnswer();
      }
    });

    selectLevel(state.selectedLevel);
    renderTeacherPreviewMode();
    initialize();
  </script>
</body>
</html>
